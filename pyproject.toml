[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dtool-lookup-client-dependency-graph-plugin"
description = "Dtool plugin for retrieving dependency graph from dtool lookup server"
readme = "README.rst"
license = {file = "LICENSE.rst"}
authors = [
    {name = "Johannes L. Hörmann", email = "johannes.laurin@gmail.com"}
]
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = [
    "asgiref",
    "click",
    "requests",
    "dtoolcore>=3.9.0",
    "dtool-cli>=0.7.1",
    "dtool_config>=0.1.1",
    "dtool-lookup-api>=0.7.0",
    "pygments",
]

[project.urls]
Repository = "https://github.com/IMTEK-Simulation/dtool-lookup-client-dependency-graph-plugin"

[project.entry-points."dtool.cli"]
graph = "dtool_lookup_client_dependency_graph_plugin:graph"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtool_lookup_client_dependency_graph_plugin*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "dtool_lookup_client_dependency_graph_plugin/version.py"
